<!-- The header's three rings, redrawn on a 16px grid so they stay crisp in a browser tab. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="none" stroke="#f2f0e9">
  <rect width="16" height="16" rx="3.5" fill="#0e0e0d" stroke="none"/>
  <circle cx="8" cy="8" r="6.5"/>
  <circle cx="8" cy="8" r="3.5" opacity="0.75"/>
  <circle cx="8" cy="8" r="1" fill="#f2f0e9" stroke="none" opacity="0.85"/>
</svg>
