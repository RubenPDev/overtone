name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public/Homepage
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            public/Homepage/package-lock.json
            public/SoleOperator/package-lock.json

      - run: npm ci
      - run: npm run build

      # Pages has no SPA fallback; serving index.html as the 404 page lets
      # deep links like /overtone/cadence/12 load the app.
      - run: cp dist/index.html dist/404.html

      # Sole Operator is its own Vite app (public/SoleOperator), built with
      # base /sole-operator/ and dropped into the site at overtone.games/sole-operator/.
      - name: Build Sole Operator
        working-directory: public/SoleOperator
        run: |
          npm ci
          npm test
          npm run build
          cp -r dist ../Homepage/dist/sole-operator

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public/Homepage/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
